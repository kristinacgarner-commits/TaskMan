<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMan — Mockup Index</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-sm mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-1">TaskMan Mockups</h1>
    <p class="text-sm text-gray-500 mb-6">Click a screen to preview it.</p>

    <ul class="space-y-3">
      <li>
        <a href="screens/home.html" class="flex items-center gap-3 bg-white rounded-xl px-4 py-3 shadow-sm hover:bg-indigo-50 transition">
          <i data-lucide="layout-dashboard" class="text-indigo-500 w-5 h-5"></i>
          <div>
            <p class="font-medium text-gray-800">Home</p>
            <p class="text-xs text-gray-400">Task list dashboard</p>
          </div>
          <i data-lucide="chevron-right" class="text-gray-300 w-4 h-4 ml-auto"></i>
        </a>
      </li>
      <li>
        <a href="screens/task-detail.html" class="flex items-center gap-3 bg-white rounded-xl px-4 py-3 shadow-sm hover:bg-indigo-50 transition">
          <i data-lucide="clipboard-list" class="text-indigo-500 w-5 h-5"></i>
          <div>
            <p class="font-medium text-gray-800">Task Detail</p>
            <p class="text-xs text-gray-400">View and edit a single task</p>
          </div>
          <i data-lucide="chevron-right" class="text-gray-300 w-4 h-4 ml-auto"></i>
        </a>
      </li>
      <li>
        <a href="screens/add-task.html" class="flex items-center gap-3 bg-white rounded-xl px-4 py-3 shadow-sm hover:bg-indigo-50 transition">
          <i data-lucide="plus-circle" class="text-indigo-500 w-5 h-5"></i>
          <div>
            <p class="font-medium text-gray-800">Add Task</p>
            <p class="text-xs text-gray-400">Create a new task</p>
          </div>
          <i data-lucide="chevron-right" class="text-gray-300 w-4 h-4 ml-auto"></i>
        </a>
      </li>
    </ul>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
