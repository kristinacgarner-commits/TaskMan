<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMan — Edit Quick Picks</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-violet-50 font-sans">
<div class="max-w-sm mx-auto h-screen flex flex-col bg-violet-50">

  <!-- Header -->
  <header class="flex items-center justify-between px-5 pt-12 pb-4 bg-white rounded-b-3xl shadow-sm">
    <a href="add-task.html" class="w-10 h-10 flex items-center justify-center rounded-2xl bg-violet-100">
      <i data-lucide="arrow-left" class="w-4 h-4 text-violet-600"></i>
    </a>
    <h1 class="text-base font-extrabold text-gray-800">Edit Quick Picks</h1>
    <div class="flex items-center gap-2">
      <!-- Save button -->
      <a href="add-task.html" class="w-10 h-10 flex items-center justify-center rounded-2xl bg-green-100">
        <i data-lucide="check" class="w-4 h-4 text-green-600"></i>
      </a>
      <a href="login.html" class="w-10 h-10 rounded-full bg-violet-100 border-2 border-violet-200 flex items-center justify-center">
        <span class="text-violet-700 font-extrabold text-xs">BJ</span>
      </a>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto px-5 py-5 pb-4">

    <!-- Edit mode banner -->
    <div class="flex items-center gap-2 bg-violet-100 border border-violet-200 rounded-3xl px-4 py-3 mb-4">
      <i data-lucide="info" class="w-4 h-4 text-violet-500 flex-shrink-0"></i>
      <p class="text-xs font-semibold text-violet-700">Tap any tile to edit it. Hit ✓ when done.</p>
    </div>

    <!-- Search -->
    <div class="relative mb-4">
      <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
        <i data-lucide="search" class="w-4 h-4 text-violet-400"></i>
      </div>
      <input type="search" placeholder="Search quick picks…" class="w-full bg-white border border-violet-200 rounded-2xl pl-9 pr-4 py-2.5 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-violet-400" />
    </div>

    <!-- Quick pick grid — edit mode -->
    <div class="grid grid-cols-3 gap-3">

      <!-- Each tile is clickable and shows an edit overlay -->
      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border-2 border-violet-200">
        <span class="text-2xl">🧹</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Vacuum</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🍽️</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Dishes</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🧺</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Laundry</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🛒</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Groceries</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🗑️</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Trash</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🧼</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Bathroom</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🌿</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Plants</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🪟</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Windows</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

      <a href="add-task-edit-item.html" class="relative flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
        <span class="text-2xl">🐾</span>
        <span class="text-xs font-bold text-gray-700 text-center leading-tight">Pet care</span>
        <div class="absolute top-2 right-2 w-5 h-5 bg-violet-500 rounded-full flex items-center justify-center">
          <i data-lucide="pencil" class="w-2.5 h-2.5 text-white"></i>
        </div>
      </a>

    </div>

    <!-- Add new tile button -->
    <button class="mt-4 w-full flex items-center justify-center gap-2 bg-white border-2 border-dashed border-violet-300 rounded-3xl py-4 text-violet-500 font-bold text-sm">
      <i data-lucide="plus-circle" class="w-5 h-5"></i>
      Add new quick pick
    </button>

  </main>

  <!-- Bottom nav -->
  <nav class="flex-shrink-0 z-10 bg-white border-t border-gray-100 flex items-center justify-around px-4 py-3">
    <a href="home.html" class="flex flex-col items-center gap-1 text-gray-400">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-xs">Home</span>
    </a>
    <a href="calendar.html" class="flex flex-col items-center gap-1 text-gray-400">
      <i data-lucide="calendar" class="w-5 h-5"></i>
      <span class="text-xs">Calendar</span>
    </a>
    <div class="w-14 h-14 -mt-7 bg-gradient-to-br from-violet-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg shadow-violet-300 flex-shrink-0">
      <i data-lucide="plus" class="w-7 h-7 text-white"></i>
    </div>
    <button class="flex flex-col items-center gap-1 text-gray-400">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span class="text-xs">Family</span>
    </button>
    <a href="login.html" class="flex flex-col items-center gap-1 text-gray-400">
      <i data-lucide="user" class="w-5 h-5"></i>
      <span class="text-xs">Me</span>
    </a>
  </nav>

</div>

<div class="max-w-sm mx-auto mt-4 text-center">
  <a href="../index.html" class="text-xs text-gray-400 hover:text-gray-600">← Back to index</a>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
