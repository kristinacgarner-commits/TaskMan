<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMan — Edit Quick Pick Item</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-violet-50 font-sans">

  <!-- Background: dimmed edit page -->
  <div class="max-w-sm mx-auto min-h-screen flex flex-col bg-violet-50 relative">

    <!-- Dimmed header -->
    <header class="flex items-center justify-between px-5 pt-12 pb-4 bg-white rounded-b-3xl shadow-sm opacity-40 pointer-events-none select-none">
      <div class="w-10 h-10 rounded-2xl bg-violet-100"></div>
      <p class="text-base font-extrabold text-gray-800">Edit Quick Picks</p>
      <div class="flex items-center gap-2">
        <div class="w-10 h-10 rounded-2xl bg-green-100"></div>
        <div class="w-10 h-10 rounded-full bg-violet-100 border-2 border-violet-200 flex items-center justify-center">
          <span class="text-violet-700 font-extrabold text-xs">BJ</span>
        </div>
      </div>
    </header>

    <!-- Dimmed grid (just a hint, blurred) -->
    <main class="flex-1 px-5 py-5 opacity-30 pointer-events-none select-none">
      <div class="flex items-center gap-2 bg-violet-100 border border-violet-200 rounded-3xl px-4 py-3 mb-5">
        <div class="w-4 h-4 rounded bg-violet-300"></div>
        <div class="h-3 w-48 bg-violet-300 rounded"></div>
      </div>
      <div class="grid grid-cols-3 gap-3">
        <div class="flex flex-col items-center gap-2 bg-white rounded-3xl py-4 px-2 shadow-sm border-2 border-violet-200">
          <span class="text-2xl">🧹</span>
          <span class="text-xs font-bold text-gray-700">Vacuum</span>
        </div>
        <div class="flex flex-col items-center gap-2 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🍽️</span>
          <span class="text-xs font-bold text-gray-700">Dishes</span>
        </div>
        <div class="flex flex-col items-center gap-2 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🧺</span>
          <span class="text-xs font-bold text-gray-700">Laundry</span>
        </div>
      </div>
    </main>

    <!-- Dimmed nav -->
    <nav class="flex items-center justify-around px-4 py-3 bg-white border-t border-gray-100 opacity-30 pointer-events-none select-none">
      <div class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-xs">Home</span>
      </div>
      <div class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-xs">Calendar</span>
      </div>
      <div class="w-14 h-14 -mt-7 bg-gradient-to-br from-violet-500 to-purple-600 rounded-full flex items-center justify-center flex-shrink-0">
        <i data-lucide="plus" class="w-7 h-7 text-white"></i>
      </div>
      <div class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span class="text-xs">Family</span>
      </div>
      <div class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-xs">Me</span>
      </div>
    </nav>

    <!-- Dark overlay -->
    <div class="absolute inset-0 bg-black/40 rounded-none"></div>

    <!-- Modal sheet -->
    <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-[2.5rem] shadow-2xl z-10 px-6 pt-6 pb-10">

      <!-- Handle -->
      <div class="w-10 h-1 bg-gray-200 rounded-full mx-auto mb-5"></div>

      <h2 class="text-lg font-extrabold text-gray-900 mb-5">Edit Quick Pick ✏️</h2>

      <div class="space-y-4">

        <!-- Icon picker -->
        <div>
          <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">Icon</label>
          <div class="relative">
            <select class="w-full appearance-none bg-gray-50 border-2 border-violet-200 rounded-2xl pl-4 pr-10 py-3 text-sm font-semibold text-gray-800 focus:outline-none focus:border-violet-400">
              <option value="vacuum">🧹  Broom / Vacuum</option>
              <option value="dishes">🍽️  Dishes</option>
              <option value="laundry">🧺  Laundry</option>
              <option value="groceries">🛒  Groceries</option>
              <option value="trash">🗑️  Trash</option>
              <option value="bathroom">🧼  Bathroom</option>
              <option value="plants">🌿  Plants</option>
              <option value="windows">🪟  Windows</option>
              <option value="petcare">🐾  Pet Care</option>
              <option value="cooking">🍳  Cooking</option>
              <option value="mowing">🌿  Mowing</option>
              <option value="ironing">👔  Ironing</option>
            </select>
            <div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
              <i data-lucide="chevron-down" class="w-4 h-4 text-violet-400"></i>
            </div>
          </div>
        </div>

        <!-- Name -->
        <div>
          <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">Name</label>
          <input
            type="text"
            value="Vacuum"
            class="w-full bg-gray-50 border-2 border-violet-200 rounded-2xl px-4 py-3 text-sm font-semibold text-gray-800 focus:outline-none focus:border-violet-400"
          />
        </div>

        <!-- Default assignee -->
        <div>
          <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">Default assignee</label>
          <div class="flex gap-2">
            <button class="flex-1 flex items-center justify-center gap-2 bg-violet-100 border-2 border-violet-400 rounded-2xl py-2.5 text-xs font-bold text-violet-700">
              <div class="w-6 h-6 rounded-full bg-violet-500 flex items-center justify-center">
                <span class="text-white font-extrabold text-xs">B</span>
              </div>
              Bean
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 bg-white border border-gray-200 rounded-2xl py-2.5 text-xs font-bold text-gray-500">
              <div class="w-6 h-6 rounded-full bg-pink-400 flex items-center justify-center">
                <span class="text-white font-extrabold text-xs">A</span>
              </div>
              Alex
            </button>
            <button class="flex-1 flex items-center justify-center gap-2 bg-white border border-gray-200 rounded-2xl py-2.5 text-xs font-bold text-gray-400">
              <div class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center">
                <i data-lucide="users" class="w-3 h-3 text-gray-400"></i>
              </div>
              Anyone
            </button>
          </div>
        </div>

        <!-- Urgency -->
        <div>
          <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">
            Urgency <span class="text-gray-400 font-normal normal-case">(days until due)</span>
          </label>
          <div class="flex items-center gap-3">
            <button class="w-10 h-10 rounded-2xl bg-violet-100 flex items-center justify-center text-violet-600 font-extrabold text-lg">−</button>
            <div class="flex-1 bg-gray-50 border-2 border-violet-200 rounded-2xl py-3 text-center">
              <span class="text-2xl font-extrabold text-gray-800">7</span>
              <span class="text-xs text-gray-400 ml-1">days</span>
            </div>
            <button class="w-10 h-10 rounded-2xl bg-violet-100 flex items-center justify-center text-violet-600 font-extrabold text-lg">+</button>
          </div>
          <p class="text-xs text-gray-400 mt-1.5 text-center">Task will be flagged urgent 7 days after creation</p>
        </div>

      </div>

      <!-- Action buttons -->
      <div class="flex gap-2 mt-6">
        <a href="add-task-edit.html" class="flex-1 flex items-center justify-center gap-1.5 bg-gray-100 text-gray-600 font-bold text-sm py-3.5 rounded-2xl">
          <i data-lucide="x" class="w-4 h-4"></i> Cancel
        </a>
        <button class="w-12 flex items-center justify-center bg-red-100 text-red-500 font-bold text-sm py-3.5 rounded-2xl">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
        <a href="add-task-edit.html" class="flex-1 flex items-center justify-center gap-1.5 bg-gradient-to-r from-violet-500 to-purple-600 text-white font-bold text-sm py-3.5 rounded-2xl">
          <i data-lucide="check" class="w-4 h-4"></i> Save
        </a>
      </div>

    </div>

  </div>

  <div class="max-w-sm mx-auto mt-4 text-center">
    <a href="../index.html" class="text-xs text-gray-400 hover:text-gray-600">← Back to index</a>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
