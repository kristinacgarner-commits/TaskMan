<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskMan — Add Chore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-violet-50 font-sans">
<div class="max-w-sm mx-auto h-screen flex flex-col bg-violet-50">

  <!-- Header -->
  <header class="flex items-center justify-between px-5 pt-12 pb-4 bg-white rounded-b-3xl shadow-sm">
    <a href="home.html" class="w-10 h-10 flex items-center justify-center rounded-2xl bg-violet-100">
      <i data-lucide="arrow-left" class="w-4 h-4 text-violet-600"></i>
    </a>
    <h1 class="text-base font-extrabold text-gray-800">Add a Chore ✏️</h1>
    <div class="flex items-center gap-2">
      <a href="add-task-edit.html" class="w-10 h-10 flex items-center justify-center rounded-2xl bg-violet-100">
        <i data-lucide="pencil" class="w-4 h-4 text-violet-600"></i>
      </a>
      <a href="login.html" class="w-10 h-10 rounded-full bg-violet-100 border-2 border-violet-200 flex items-center justify-center">
        <span class="text-violet-700 font-extrabold text-xs">BJ</span>
      </a>
    </div>
  </header>

  <main class="flex-1 overflow-y-auto px-5 py-5 space-y-6 pb-4">

    <!-- Quick pick -->
    <section>
      <p class="text-xs font-extrabold text-violet-500 uppercase tracking-widest mb-3">⚡ Quick pick</p>
      <!-- Search -->
      <div class="relative mb-3">
        <div class="absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none">
          <i data-lucide="search" class="w-4 h-4 text-violet-400"></i>
        </div>
        <input type="search" placeholder="Search quick picks…" class="w-full bg-white border border-violet-200 rounded-2xl pl-9 pr-4 py-2.5 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:border-violet-400" />
      </div>
      <div class="grid grid-cols-3 gap-2">
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border-2 border-violet-300">
          <span class="text-2xl">🧹</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Vacuum</span>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🍽️</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Dishes</span>
        </button>
        <!-- Greyed out: already scheduled today -->
        <button disabled class="relative flex flex-col items-center gap-1.5 bg-gray-100 rounded-3xl py-4 px-2 shadow-sm border border-gray-200 opacity-60 cursor-not-allowed">
          <span class="text-2xl grayscale">🧺</span>
          <span class="text-xs font-bold text-gray-400 text-center leading-tight">Laundry</span>
          <div class="absolute top-2 right-2 w-4 h-4 bg-green-400 rounded-full flex items-center justify-center">
            <i data-lucide="check" class="w-2.5 h-2.5 text-white"></i>
          </div>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🛒</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Groceries</span>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🗑️</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Trash</span>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🧼</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Bathroom</span>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🌿</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Plants</span>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🪟</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Windows</span>
        </button>
        <button class="flex flex-col items-center gap-1.5 bg-white rounded-3xl py-4 px-2 shadow-sm border border-gray-100">
          <span class="text-2xl">🐾</span>
          <span class="text-xs font-bold text-gray-700 text-center leading-tight">Pet care</span>
        </button>
      </div>
    </section>

    <!-- Divider -->
    <div class="flex items-center gap-3">
      <div class="flex-1 h-px bg-gray-200"></div>
      <span class="text-xs text-gray-400 font-bold">or type your own</span>
      <div class="flex-1 h-px bg-gray-200"></div>
    </div>

    <!-- Custom title -->
    <section>
      <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">Chore name</label>
      <div class="relative">
        <div class="absolute left-4 top-1/2 -translate-y-1/2">
          <span class="text-xl">🧹</span>
        </div>
        <input
          type="text"
          value="Vacuum living room"
          class="w-full bg-white border-2 border-violet-300 rounded-3xl pl-12 pr-4 py-3.5 text-sm font-semibold text-gray-800 focus:outline-none focus:ring-2 focus:ring-violet-300"
        />
      </div>
    </section>

    <!-- Due date -->
    <section>
      <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">Due date</label>
      <!-- Mini calendar strip -->
      <div class="bg-white rounded-3xl p-4 shadow-sm border border-violet-100">
        <div class="flex items-center justify-between mb-3">
          <button class="w-8 h-8 flex items-center justify-center rounded-2xl bg-violet-100">
            <i data-lucide="chevron-left" class="w-4 h-4 text-violet-600"></i>
          </button>
          <p class="text-sm font-extrabold text-gray-800">April 2026</p>
          <button class="w-8 h-8 flex items-center justify-center rounded-2xl bg-violet-100">
            <i data-lucide="chevron-right" class="w-4 h-4 text-violet-600"></i>
          </button>
        </div>
        <div class="grid grid-cols-7 gap-1 text-center">
          <span class="text-xs text-gray-400 font-semibold py-1">S</span>
          <span class="text-xs text-gray-400 font-semibold py-1">M</span>
          <span class="text-xs text-gray-400 font-semibold py-1">T</span>
          <span class="text-xs text-gray-400 font-semibold py-1">W</span>
          <span class="text-xs text-gray-400 font-semibold py-1">T</span>
          <span class="text-xs text-gray-400 font-semibold py-1">F</span>
          <span class="text-xs text-gray-400 font-semibold py-1">S</span>

          <span class="text-xs text-gray-300 py-2">  </span>
          <span class="text-xs text-gray-300 py-2">  </span>
          <span class="text-xs text-gray-600 py-2">1</span>
          <span class="text-xs text-gray-600 py-2">2</span>
          <span class="text-xs text-gray-600 py-2">3</span>
          <span class="text-xs text-gray-600 py-2">4</span>
          <span class="text-xs text-gray-600 py-2">5</span>

          <span class="text-xs text-gray-600 py-2">6</span>
          <span class="text-xs text-gray-600 py-2">7</span>
          <span class="text-xs text-gray-600 py-2">8</span>
          <span class="text-xs text-gray-600 py-2">9</span>
          <span class="text-xs text-gray-600 py-2">10</span>
          <span class="text-xs text-gray-600 py-2">11</span>
          <span class="text-xs text-gray-600 py-2">12</span>

          <span class="text-xs text-gray-600 py-2">13</span>
          <span class="text-xs text-gray-600 py-2">14</span>
          <span class="text-xs text-gray-600 py-2">15</span>
          <span class="text-xs text-gray-600 py-2">16</span>
          <span class="text-xs text-gray-600 py-2">17</span>
          <span class="text-xs text-gray-500 font-bold py-2">18</span>
          <span class="text-xs text-gray-600 py-2">19</span>

          <span class="text-xs text-gray-600 py-2">20</span>
          <span class="text-xs w-7 h-7 mx-auto bg-violet-500 text-white font-extrabold rounded-full flex items-center justify-center">21</span>
          <span class="text-xs text-gray-600 py-2">22</span>
          <span class="text-xs text-gray-600 py-2">23</span>
          <span class="text-xs text-gray-600 py-2">24</span>
          <span class="text-xs text-gray-600 py-2">25</span>
          <span class="text-xs text-gray-600 py-2">26</span>

          <span class="text-xs text-gray-600 py-2">27</span>
          <span class="text-xs text-gray-600 py-2">28</span>
          <span class="text-xs text-gray-600 py-2">29</span>
          <span class="text-xs text-gray-600 py-2">30</span>
        </div>
      </div>
    </section>

    <!-- Assign to -->
    <section>
      <label class="text-xs font-extrabold text-violet-500 uppercase tracking-widest block mb-2">Assign to</label>
      <div class="flex gap-3">
        <button class="flex-1 flex flex-col items-center gap-2 bg-violet-100 border-2 border-violet-400 rounded-3xl py-4">
          <div class="w-10 h-10 rounded-full bg-violet-500 flex items-center justify-center">
            <span class="text-white font-extrabold text-sm">BJ</span>
          </div>
          <span class="text-xs font-bold text-violet-700">Me (Bean)</span>
        </button>
        <button class="flex-1 flex flex-col items-center gap-2 bg-white border border-gray-200 rounded-3xl py-4">
          <div class="w-10 h-10 rounded-full bg-pink-400 flex items-center justify-center">
            <span class="text-white font-extrabold text-sm">AL</span>
          </div>
          <span class="text-xs font-bold text-gray-500">Alex</span>
        </button>
        <button class="flex-1 flex flex-col items-center gap-2 bg-white border border-gray-200 rounded-3xl py-4">
          <div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center">
            <i data-lucide="user-plus" class="w-4 h-4 text-gray-400"></i>
          </div>
          <span class="text-xs font-bold text-gray-400">Anyone</span>
        </button>
      </div>
    </section>

  </main>

  <!-- Submit + nav -->
  <div class="flex-shrink-0 z-10 bg-white border-t border-gray-100">
    <div class="px-5 py-3">
      <button class="w-full bg-gradient-to-r from-violet-500 to-purple-600 text-white font-extrabold text-sm py-4 rounded-3xl flex items-center justify-center gap-2 shadow-lg shadow-violet-200">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        Add Chore 🎉
      </button>
    </div>
    <nav class="flex items-center justify-around px-4 py-3 border-t border-gray-100">
      <a href="home.html" class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="home" class="w-5 h-5"></i>
        <span class="text-xs">Home</span>
      </a>
      <a href="calendar.html" class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span class="text-xs">Calendar</span>
      </a>
      <div class="w-14 h-14 -mt-7 bg-gradient-to-br from-violet-500 to-purple-600 rounded-full flex items-center justify-center shadow-lg shadow-violet-300 flex-shrink-0">
        <i data-lucide="plus" class="w-7 h-7 text-white"></i>
      </div>
      <button class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="users" class="w-5 h-5"></i>
        <span class="text-xs">Family</span>
      </button>
      <a href="login.html" class="flex flex-col items-center gap-1 text-gray-400">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span class="text-xs">Me</span>
      </a>
    </nav>
  </div>

</div>

<div class="max-w-sm mx-auto mt-4 text-center">
  <a href="../index.html" class="text-xs text-gray-400 hover:text-gray-600">← Back to index</a>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
